<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Source-derived regression fixture from the real Henkel S02 candidate. -->
  <text x="69" y="145" fill="#E6E6E6" font-size="14"><tspan>A single agent orchestrates</tspan><tspan dx="4" fill="#FFE600" font-weight="700">deterministic controls</tspan><tspan dx="4">while rules remain the authority for posting.</tspan></text>
  <text x="48" y="227" fill="#FFFFFF" font-size="12.5"><tspan x="48" y="227">Input event｜</tspan><tspan x="48" y="244" fill="#FFE600">Front-end transactions</tspan></text>
  <text x="64" y="346" fill="#D9D9D9" font-size="9.8"><tspan x="64" y="346">Vendor, G/L account, cost center,</tspan><tspan x="64" y="362">amount, PO, posting date or</tspan><tspan x="64" y="378">description changes</tspan><tspan dx="3" fill="#FFE600" font-weight="700">trigger</tspan><tspan x="64" y="394" fill="#FFE600" font-weight="700">validation immediately.</tspan></text>
  <text x="260" y="346" fill="#D9D9D9" font-size="9.8"><tspan x="260" y="346">Read the evolving transaction context ·</tspan><tspan x="260" y="362">identify impacted controls ·</tspan><tspan dx="3" fill="#FFE600" font-weight="700">choose the</tspan><tspan x="260" y="378" fill="#FFE600" font-weight="700">next required tool</tspan></text>
  <text x="832" y="346" fill="#D9D9D9" font-size="9.6"><tspan x="832" y="346">Read the rule hit, severity and evidence;</tspan><tspan x="832" y="362">return</tspan><tspan dx="3" fill="#FFE600" font-weight="700">Validated, Warning or Correction</tspan><tspan x="832" y="378" fill="#FFE600" font-weight="700">required</tspan><tspan dx="3" fill="#D9D9D9">beside the relevant field.</tspan></text>
  <text x="1056" y="346" fill="#D9D9D9" font-size="9.3"><tspan x="1056" y="346">Post confirms the accumulated</tspan><tspan x="1056" y="361">validation state is current—</tspan><tspan x="1056" y="376" fill="#FF8A80" font-weight="700">no full invoice re-validation</tspan><tspan fill="#D9D9D9">—then</tspan><tspan x="1056" y="391">executes. Exceptions</tspan><tspan dx="3" fill="#FFE600" font-weight="700">return to the</tspan><tspan x="1056" y="406" fill="#FFE600" font-weight="700">loop or human review</tspan><tspan dx="2" fill="#D9D9D9">; every tool call,</tspan><tspan x="1056" y="421">rule result, correction and final decision</tspan><tspan x="1056" y="436" fill="#FFE600" font-weight="700">remains traceable.</tspan></text>
</svg>
